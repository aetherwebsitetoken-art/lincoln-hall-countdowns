name: Update countdowns

on:
  schedule:
    # Once a day is plenty: break dates are fixed for the year, and this run
    # only needs to notice when the district posts the 8th grade date.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Build countdowns
        run: python3 build_countdown.py

      - name: Commit updated countdowns (if they changed)
        # Runs even if the build step reported a problem: embed.html is still
        # built from school_year.json, and that should be saved.
        if: success() || failure()
        id: commit
        run: |
          git config user.name "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          # embed.html is the paste-ready page for Google Sites. The builder
          # makes it from the index.html template; the template is never
          # modified by the bot.
          git add countdown.json embed.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git commit -m "Auto-update countdowns"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          REPO="${GITHUB_REPOSITORY}"
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/countdown.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${REPO}@main/embed.html" || true
